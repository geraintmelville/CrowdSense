<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recall versus budget</title>
  <style>
    body { margin: 0; padding: 16px; font: 12px sans-serif; color: #52514e; background: #fff; }
    #vis-container { max-width: 520px; margin: 0 auto; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 8px; }
    .legend span { display: inline-flex; align-items: center; gap: 4px; }
    .swatch { width: 14px; border-top: 2px dashed #898781; }
    .model { width: 10px; height: 10px; border-radius: 2px; background: #2a78d6; }
    .perfect { border-top-style: dotted; border-color: #1baf7a; }
    .area { width: 10px; height: 10px; border-radius: 2px; background: rgba(42,120,214,.2); }
    .chart { aspect-ratio: 1; }
    @media (prefers-color-scheme: dark) {
      body { color: #c3c2b7; background: #1c1c1b; }
    }
  </style>
</head>
<body>
  <main id="vis-container">
    <p class="legend" aria-hidden="true">
      <span><i class="swatch"></i>Random model (diagonal)</span>
      <span><i class="model"></i>Realistic model</span>
      <span><i class="swatch perfect"></i>Perfect model</span>
      <span><i class="area"></i>Area = model quality</span>
    </p>
    <div class="chart"><canvas id="recall-chart" role="img" aria-label="Recall versus budget. Random model is a diagonal. The perfect model reaches full recall at the theoretical limit. Our model is a concave curve between them; the area between it and the diagonal is shaded."></canvas></div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script>
    const limit = 0.12;
    const random = [{x: 0, y: 0}, {x: 1, y: 1}];
    const model = Array.from({length: 51}, (_, i) => {
      const x = i / 50;
      return {x, y: (1 - Math.exp(-5 * x)) / (1 - Math.exp(-5))};
    });
    const perfect = [{x: 0, y: 0}, {x: limit, y: 1}, {x: 1, y: 1}];
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const tick = '#898781', grid = dark ? '#2c2c2a' : '#e1e0d9';
    const limitLine = {id: 'limitLine', afterDatasetsDraw({ctx, scales: {x, y}}) {
      const px = x.getPixelForValue(limit);
      ctx.save(); ctx.setLineDash([3, 3]); ctx.strokeStyle = tick;
      ctx.beginPath(); ctx.moveTo(px, y.getPixelForValue(1)); ctx.lineTo(px, y.getPixelForValue(0)); ctx.stroke();
      ctx.setLineDash([]); ctx.fillStyle = dark ? '#c3c2b7' : '#52514e';
      ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('Limit', px + 8, y.getPixelForValue(0) - 10); ctx.restore();
    }};
    new Chart(document.getElementById('recall-chart'), {
      type: 'line', plugins: [limitLine],
      data: {datasets: [
        {label: 'Random', data: random, borderColor: tick, borderDash: [6, 4], borderWidth: 2, pointRadius: 0},
        {label: 'Our model', data: model, borderColor: '#2a78d6', borderWidth: 2, pointRadius: 0, tension: .3,
          fill: {target: 0, above: 'rgba(42,120,214,.2)', below: 'rgba(42,120,214,.2)'}},
        {label: 'Perfect', data: perfect, borderColor: '#1baf7a', borderDash: [2, 3], borderWidth: 2, pointRadius: 0}
      ]},
      options: {responsive: true, maintainAspectRatio: true, aspectRatio: 1,
        plugins: {legend: {display: false}, tooltip: {enabled: false}},
        scales: {
          x: {type: 'linear', min: 0, max: 1, title: {display: true, text: 'Budget', color: tick},
            ticks: {color: tick, stepSize: .2, callback: v => Math.round(v * 100) + '%'}, grid: {color: grid}},
          y: {type: 'linear', min: 0, max: 1.05, title: {display: true, text: 'Recall', color: tick},
            ticks: {color: tick, stepSize: .2, callback: v => v <= 1.001 ? Math.round(v * 100) + '%' : ''}, grid: {color: grid}}
        }
      }
    });
  </script>
</body>
</html>
